apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include ALL yaml manifests in this folder (adservice.yaml, cartservice.yaml, redis-cart.yaml, etc.)
resources:
  - .   # <-- this is the important part; do NOT list redis.yaml explicitly

# Override Google Container Registry images with Docker Hub images
images:
  - name: gcr.io/google-samples/microservices-demo/adservice
    newName: anvesh35/microservices-demo-adservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/cartservice
    newName: anvesh35/microservices-demo-cartservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/checkoutservice
    newName: anvesh35/microservices-demo-checkoutservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/currencyservice
    newName: anvesh35/microservices-demo-currencyservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/emailservice
    newName: anvesh35/microservices-demo-emailservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/frontend
    newName: anvesh35/microservices-demo-frontend
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/loadgenerator
    newName: anvesh35/microservices-demo-loadgenerator
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/paymentservice
    newName: anvesh35/microservices-demo-paymentservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/productcatalogservice
    newName: anvesh35/microservices-demo-productcatalogservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/recommendationservice
    newName: anvesh35/microservices-demo-recommendationservice
    newTag: latest

  - name: gcr.io/google-samples/microservices-demo/shippingservice
    newName: anvesh35/microservices-demo-shippingservice
    newTag: latest
